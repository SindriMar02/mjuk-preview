# Prices, stock and what is listed, refreshed from her WooCommerce with the READ-ONLY key.
# Facts (composition, type, origin) come from the last full local pull and are carried over.
#
# Off until launch: run it by hand from the Actions tab. At launch, uncomment the schedule.
# Each run is about 40 GET requests, 4 seconds apart; her host is shared hosting on PHP 7.0
# and must be read gently. The key goes in the repository secrets MJUK_WOO_URL, MJUK_WOO_CK
# and MJUK_WOO_CS (Settings, Secrets and variables, Actions), set by Sindri; without them the
# run says so and stops.
name: Stock and prices from her shop

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "What asked for this run (a WooCommerce webhook topic via the router's /sndr/refresh, or 'by hand')"
        required: false
        default: by hand
  # schedule:
  #   - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read her shop (read-only key)
        env:
          MJUK_WOO_URL: ${{ secrets.MJUK_WOO_URL }}
          MJUK_WOO_CK: ${{ secrets.MJUK_WOO_CK }}
          MJUK_WOO_CS: ${{ secrets.MJUK_WOO_CS }}
        run: |
          # a run that read nothing must not look like a run with nothing to change: fail loudly
          if [ -z "$MJUK_WOO_URL" ] || [ -z "$MJUK_WOO_CK" ] || [ -z "$MJUK_WOO_CS" ]; then echo "::error::The read-only key is not fully in the repository secrets (URL, CK, CS), so nothing was read."; exit 1; fi
          node tools/pull-woo.mjs --live
          # the shop report (what needs Anna, what is not on the shop and why) on the run's page
          if [ -f reports/shop-health.md ]; then cat reports/shop-health.md >> "$GITHUB_STEP_SUMMARY"; fi
      # every product page carries its price and availability in the HTML, so they are rewritten with
      # the data (pieces that left the shop lose their page; tools/check-seo.mjs must pass)
      - name: Product pages, catalogue and sitemaps
        run: |
          if git diff --quiet -- assets/data.js assets/copy.js; then echo "Nothing changed."; exit 0; fi
          # a failure here is ours, never her content: tools/e2e-daily.mjs proves the build takes
          # anything she can enter; GitHub emails the repository owner when a run fails
          node tools/build-products.mjs
          node tools/check-seo.mjs
      # The live site is the Worker's copy of dist/, not this repository: a pull that only commits
      # leaves mjukiceland.com showing yesterday's prices and "in stock" on a sold piece. So every
      # change is built for launch and deployed, when the repository variable MJUK_DEPLOY is "1"
      # (set by Sindri at launch, step 10 of _docs/MJUK-LAUNCH-ROUTING-2026-09-25.md) and the
      # Cloudflare token is in the secrets. Before launch this step says so and does nothing.
      - name: Launch build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MJUK_DEPLOY: ${{ vars.MJUK_DEPLOY }}
        run: |
          if git diff --quiet -- assets/data.js assets/copy.js; then echo "Nothing changed."; exit 0; fi
          if [ "$MJUK_DEPLOY" != "1" ]; then echo "::notice::Not deployed: MJUK_DEPLOY is not 1 (before launch)."; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::MJUK_DEPLOY is 1 but the Cloudflare token or account id is missing: the live site was NOT refreshed."; exit 1; fi
          node tools/build-pages.mjs && node tools/build-is.mjs && node tools/build-products.mjs
          node tools/check-seo.mjs
          node tools/build-production.mjs
          npx -y wrangler@4 deploy
          echo "Deployed the refreshed storefront." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish if anything changed
        run: |
          # staged first, so a report that is new (not yet in the repository) counts as a change too
          git add -A assets/data.js assets/copy.js product is/product shop.html is/shop.html sitemap.xml is/sitemap.xml reports/shop-health.md
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "mjuk-stock"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stock and prices from her shop"
          # the branch may have moved while this ran: replay this one data commit on top
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
